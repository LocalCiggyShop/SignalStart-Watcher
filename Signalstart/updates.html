<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SignalStart Watcher updates</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="updates-page">
    <header class="top">
      <div class="brand">
        <img src="icons/icon48.png" width="32" height="32" alt="" />
        <h1>SignalStart Watcher updates</h1>
      </div>
    </header>
    <main>
      <section class="card" aria-labelledby="folderTitle">
        <h2 id="folderTitle">Extension folder</h2>
        <p class="hint">Choose the folder you loaded in Chrome. If Chrome offers <b>Allow on every visit</b>, select it so updates can run in the background.</p>
        <div class="setup-actions">
          <button id="chooseFolder" type="button">Choose folder</button>
          <button id="restoreFolder" class="secondary hidden" type="button">Restore folder access</button>
        </div>
        <p id="folderStatus" class="hint" role="status"></p>
      </section>
      <p id="setupStatus" class="hint" role="status"></p>
    </main>
    <script src="updates.js" type="module"></script>
  </body>
</html>
